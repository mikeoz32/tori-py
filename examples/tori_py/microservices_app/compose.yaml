name: tori-py-microservices-app

x-app: &app
  image: tori-py-microservices-app:local
  environment: &app-environment
    PYTHONPATH: /workspace
    RABBITMQ_URL: amqp://demo:demo@rabbitmq:5672/
  restart: on-failure
  stop_grace_period: 35s

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  catalog-migrate:
    <<: *app
    build:
      context: ../../..
      dockerfile: examples/tori_py/microservices_app/Dockerfile
    environment:
      <<: *app-environment
      CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog@postgres:5432/catalog
    command: ["uv", "run", "--no-sync", "python", "-m", "examples.tori_py.microservices_app.catalog.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  orders-migrate:
    <<: *app
    environment:
      <<: *app-environment
      ORDERS_DATABASE_URL: postgresql+psycopg://orders:orders@postgres:5432/orders
    command: ["uv", "run", "--no-sync", "python", "-m", "examples.tori_py.microservices_app.orders.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  notifications-migrate:
    <<: *app
    environment:
      <<: *app-environment
      NOTIFICATIONS_DATABASE_URL: postgresql+psycopg://notifications:notifications@postgres:5432/notifications
    command: ["uv", "run", "--no-sync", "python", "-m", "examples.tori_py.microservices_app.notifications.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    <<: *app
    environment:
      <<: *app-environment
      CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog@postgres:5432/catalog
    command: ["uv", "run", "--no-sync", "python", "-m", "examples.tori_py.microservices_app.catalog.app"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully

  orders:
    <<: *app
    environment:
      <<: *app-environment
      ORDERS_DATABASE_URL: postgresql+psycopg://orders:orders@postgres:5432/orders
    command: ["uv", "run", "--no-sync", "python", "-m", "examples.tori_py.microservices_app.orders.app"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully

  notifications:
    <<: *app
    environment:
      <<: *app-environment
      NOTIFICATIONS_DATABASE_URL: postgresql+psycopg://notifications:notifications@postgres:5432/notifications
    command: ["uv", "run", "--no-sync", "python", "-m", "examples.tori_py.microservices_app.notifications.app"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      notifications-migrate:
        condition: service_completed_successfully

  api-gateway:
    <<: *app
    command: ["uv", "run", "--no-sync", "uvicorn", "examples.tori_py.microservices_app.gateway.app:application", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
      orders:
        condition: service_started
      notifications:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
