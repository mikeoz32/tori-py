[tool.uv.workspace]
exclude = ["benchmarks"]
members = [
    "packages/tori-py-cqrs-core",
    "packages/tori-py-cqrs-event-sourcing-core",
    "packages/tori-py-cqrs-fastapi",
    "packages/tori-py",
    "packages/tori-py-cqrs",
    "packages/tori-py-cqrs-event-sourcing",
    "packages/tori-py-openapi",
    "packages/tori-py-sqlalchemy",
    "packages/tori-py-microservices",
    "packages/tori-py-persistent-streams-core",
    "packages/tori-py-persistent-streams",
    "packages/tori-py-persistent-streams-rabbitmq",
    "packages/tori-py-liveview",
    "packages/tori-py-liveview-ui",
]

[tool.uv.sources]
tori-py-cqrs-core = { workspace = true }
tori-py-cqrs = { workspace = true }
tori-py-sqlalchemy = { workspace = true }
tori-py-framework = { workspace = true }
tori-py-cqrs-event-sourcing-core = { workspace = true }
tori-py-cqrs-fastapi = { workspace = true }
tori-py-cqrs-event-sourcing = { workspace = true }
tori-py-openapi = { workspace = true }
tori-py-microservices = { workspace = true }
tori-py-persistent-streams-core = { workspace = true }
tori-py-persistent-streams = { workspace = true }
tori-py-persistent-streams-rabbitmq = { workspace = true }
tori-py-liveview = { workspace = true }
tori-py-liveview-ui = { workspace = true }

[dependency-groups]
dev = [
    "aio-pika>=10,<11",
    "aiosqlite>=0.22.1",
    "tori-py-cqrs-event-sourcing-core>=0.1.0,<0.2.0",
    "tori-py-cqrs-fastapi>=0.1.0,<0.2.0",
    "tori-py-cqrs-event-sourcing>=0.1.0,<0.2.0",
    "tori-py-microservices>=0.1.0,<0.2.0",
    "tori-py-openapi>=0.1.0,<0.2.0",
    "tori-py-persistent-streams>=0.1.0,<0.2.0",
    "tori-py-liveview>=0.1.0,<0.2.0",
    "tori-py-liveview-ui>=0.1.0,<0.2.0",
    "tori-py-framework[testing]>=0.1.0,<0.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-docker>=3.2.5",
    "ruff>=0.15.21",
    "ty>=0.0.59",
    "psycopg>=3.2,<4 ; sys_platform == 'linux'",
    "pyjwt[crypto]>=2.13,<3",
    "pytest-playwright>=0.7,<1",
    "websockets>=17,<18",
    "uvicorn>=0.41,<1",
    "tzdata>=2026.3",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --ignore=benchmarks"
pythonpath = ["."]
markers = [
    "rabbitmq: integration tests requiring Docker and RabbitMQ",
]
