[project]
name = "kinker"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cqrs-core==0.1.0",
    "nestpy==0.1.0",
    "nestpy-cqrs==0.1.0",
    "nestpy-sqlalchemy==0.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "msgspec>=0.19.0",
    "alembic>=1.18.5",
    "uvicorn>=0.36.0",
    "pyjwt[crypto]>=2.13.0,<3",
    "httpx>=0.28.0",
    "nestpy-openapi==0.1.0",
]

[project.scripts]
kinker = "kinker.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/cqrs-core",
    "packages/cqrs-event-sourcing",
    "packages/cqrs-fastapi",
    "packages/nestpy",
    "packages/nestpy-cqrs",
    "packages/nestpy-cqrs-event-sourcing",
    "packages/nestpy-openapi",
    "packages/nestpy-sqlalchemy",
]

[tool.uv.sources]
cqrs-core = { workspace = true }
nestpy-cqrs = { workspace = true }
nestpy-sqlalchemy = { workspace = true }
nestpy = { workspace = true }
cqrs-event-sourcing = { workspace = true }
cqrs-fastapi = { workspace = true }
nestpy-cqrs-event-sourcing = { workspace = true }
nestpy-openapi = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "cqrs-event-sourcing",
    "cqrs-fastapi",
    "nestpy-cqrs-event-sourcing",
    "nestpy-openapi",
    "nestpy[testing]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
