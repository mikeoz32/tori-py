[project]
name = "kinker"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cqrs-core",
    "cqrs-event-sourcing",
    "cqrs-fastapi",
    "nestpy",
    "nestpy-cqrs",
    "nestpy-cqrs-event-sourcing",
    "nestpy-sqlalchemy",
    "uvicorn>=0.51.0",
]

[tool.uv.workspace]
members = [
    "packages/cqrs-core",
    "packages/cqrs-event-sourcing",
    "packages/cqrs-fastapi",
    "packages/nestpy",
    "packages/nestpy-cqrs",
    "packages/nestpy-cqrs-event-sourcing",
    "packages/nestpy-sqlalchemy",
]

[tool.uv.sources]
cqrs-core = { workspace = true }
cqrs-fastapi = { workspace = true }
nestpy = { workspace = true }
nestpy-cqrs = { workspace = true }
nestpy-cqrs-event-sourcing = { workspace = true }
cqrs-event-sourcing = { workspace = true }
nestpy-sqlalchemy = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pymdown-extensions>=11.0.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
