name: Release

on:
  push:
    tags: ["v0.1.0"]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing full tag name (the initial train requires v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Resolve exact release tag to an immutable commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$PUSH_TAG"
            [[ "$PUSH_REF" == "refs/tags/$release_tag" ]]
          fi
          [[ "$release_tag" == "v0.1.0" ]]
          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          git show-ref --verify --quiet "refs/tags/$release_tag"
          release_sha="$(git rev-parse --verify "$release_tag^{commit}")"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$release_sha" == "$PUSH_SHA" ]]
          fi
          printf 'release_tag=%s\nrelease_sha=%s\n' "$release_tag" "$release_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.28"
      - run: uv python install 3.14
      - run: uv run --no-project --python 3.14 python -c "import sys; assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final', sys.version"
      - run: uv lock --check
      - run: uv sync --locked --all-packages --all-groups
      - name: Validate coordinated initial family version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: python
        run: |
          import os
          import subprocess
          from scripts.release_manifest import family_version, load_manifest
          version = family_version(load_manifest())
          assert version == "0.1.0", version
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          assert not subprocess.check_output(["git", "status", "--porcelain"], text=True)
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check packages tests examples
      - run: uv run pytest -m "not rabbitmq"
      - run: uv run mkdocs build --strict
      - run: uv run scripts/build_release.py --dist-dir dist --digest-manifest release-digests.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ needs.prepare.outputs.release_sha }}
          path: |
            dist/*
            release-digests.json
          if-no-files-found: error

  rabbitmq-artifact-smoke:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: tori_py
          RABBITMQ_DEFAULT_PASS: tori_py
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ needs.prepare.outputs.release_sha }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.28"
      - run: uv python install 3.14
      - run: uv run --no-project --python 3.14 python -c "import sys; assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final', sys.version"
      - run: uv run --no-project python packages/tori-py-microservices/scripts/verify_artifacts.py dist amqp://tori_py:tori_py@localhost:5672/

  attest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ needs.prepare.outputs.release_sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  testpypi:
    needs: [prepare, build, attest, rabbitmq-artifact-smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ needs.prepare.outputs.release_sha }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  testpypi-smoke:
    needs: [prepare, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ needs.prepare.outputs.release_sha }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.28"
      - run: uv python install 3.14
      - run: uv run --no-project --python 3.14 python -c "import sys; assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final', sys.version"
      - run: uv run --no-project scripts/testpypi_smoke.py --digest-manifest release-digests.json

  pypi:
    needs: [prepare, testpypi-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions-${{ needs.prepare.outputs.release_sha }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.28"
      - run: uv python install 3.14
      - run: uv run --no-project --python 3.14 python -c "import sys; assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final', sys.version"
      - run: uv run --no-project scripts/verify_release_digests.py --dist-dir dist --digest-manifest release-digests.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
