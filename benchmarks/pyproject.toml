[project]
name = "tori-py-benchmarks"
version = "0.1.0"
description = "Reproducible competitor benchmarks for Tori Py"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.139.0",
    "litestar==2.24.0",
    "starlette==1.3.1",
    "tori-py-framework",
    "uvicorn[standard]==0.41.0",
]

[project.scripts]
tori-py-benchmark = "tori_py_benchmarks.runner:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.15.21,<0.16",
    "ty>=0.0.59,<0.1",
]

[tool.uv.sources]
tori-py-framework = { path = "../packages/tori-py", editable = true }

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"
