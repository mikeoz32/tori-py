[project]
name = "persistent-streams-rabbitmq"
version = "0.1.0"
description = "RabbitMQ native Streams adapter for persistent-streams and Nestpy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nestpy-persistent-streams",
    "persistent-streams",
    "rstream==1.0.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
nestpy-persistent-streams = { workspace = true }
persistent-streams = { workspace = true }
