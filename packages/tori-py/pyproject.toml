[project]
name = "tori-py-framework"
version = "0.1.0"
description = "Python-native application framework with a Starlette driver"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mykhailo Kozlovskyi" }]
maintainers = [{ name = "Mykhailo Kozlovskyi" }]
keywords = ["asgi", "dependency-injection", "framework", "starlette", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.19.0",
    "starlette>=0.47.0",
]
[project.optional-dependencies]
settings-yaml = ["PyYAML>=6.0"]
cli = ["uvicorn>=0.35.0"]
testing = [
    "httpx>=0.28.0",
]

[project.scripts]
tori-py = "tori_py.cli:main"

[project.urls]
Homepage = "https://github.com/mikeoz32/tori-py"
Documentation = "https://github.com/mikeoz32/tori-py#readme"
Repository = "https://github.com/mikeoz32/tori-py"
Issues = "https://github.com/mikeoz32/tori-py/issues"
Changelog = "https://github.com/mikeoz32/tori-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tori_py"
