[project]
name = "nestpy-cqrs"
version = "0.1.0"
description = "Nestpy integration for cqrs-core"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cqrs-core",
    "nestpy",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
cqrs-core = { workspace = true }
nestpy = { workspace = true }
