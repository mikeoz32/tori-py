[project]
name = "cqrs-fastapi"
version = "0.1.0"
description = "FastAPI integration for cqrs-core"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cqrs-core",
    "fastapi>=0.139.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
cqrs-core = { workspace = true }
