[project]
name = "tori-py-openapi"
version = "0.1.0"
description = "OpenAPI 3.1 documentation integration for ToriPy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mykhailo Kozlovskyi" }]
maintainers = [{ name = "Mykhailo Kozlovskyi" }]
keywords = ["asgi", "openapi", "swagger", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.19.0",
    "tori-py>=0.1.0,<0.2.0",
    "starlette>=0.47.0",
]

[project.urls]
Homepage = "https://github.com/mikeoz32/tori-py"
Documentation = "https://github.com/mikeoz32/tori-py/tree/main/packages/tori-py-openapi#readme"
Repository = "https://github.com/mikeoz32/tori-py"
Issues = "https://github.com/mikeoz32/tori-py/issues"
Changelog = "https://github.com/mikeoz32/tori-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py = { workspace = true }
