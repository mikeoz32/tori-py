[project]
name = "tori-py-persistent-streams"
version = "0.1.0"
description = "Persistent stream integration for ToriPy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tori-py",
    "tori-py-persistent-streams-core",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py = { workspace = true }
tori-py-persistent-streams-core = { workspace = true }
