[project]
name = "nestpy-cqrs-event-sourcing"
version = "0.1.0"
description = "Nestpy integration for cqrs-event-sourcing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cqrs-core",
    "cqrs-event-sourcing",
    "nestpy",
    "nestpy-cqrs",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
cqrs-core = { workspace = true }
cqrs-event-sourcing = { workspace = true }
nestpy = { workspace = true }
nestpy-cqrs = { workspace = true }
