[project]
name = "tori-py-cqrs-event-sourcing"
version = "0.1.0"
description = "Transactional event-sourcing integration for Tori Py CQRS"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mykhailo Kozlovskyi" }]
maintainers = [{ name = "Mykhailo Kozlovskyi" }]
keywords = ["cqrs", "event-sourcing", "transactions", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "tori-py-cqrs-core>=0.1.0,<0.2.0",
    "tori-py-cqrs-event-sourcing-core>=0.1.0,<0.2.0",
    "tori-py>=0.1.0,<0.2.0",
    "tori-py-cqrs>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/mikeoz32/tori-py"
Documentation = "https://github.com/mikeoz32/tori-py/tree/main/packages/tori-py-cqrs-event-sourcing#readme"
Repository = "https://github.com/mikeoz32/tori-py"
Issues = "https://github.com/mikeoz32/tori-py/issues"
Changelog = "https://github.com/mikeoz32/tori-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py-cqrs-core = { workspace = true }
tori-py-cqrs-event-sourcing-core = { workspace = true }
tori-py = { workspace = true }
tori-py-cqrs = { workspace = true }
