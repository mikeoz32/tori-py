[project]
name = "tori-py-cqrs-event-sourcing"
version = "0.1.0"
description = "ToriPy integration for tori-py-cqrs-event-sourcing-core"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tori-py-cqrs-core",
    "tori-py-cqrs-event-sourcing-core",
    "tori-py",
    "tori-py-cqrs",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py-cqrs-core = { workspace = true }
tori-py-cqrs-event-sourcing-core = { workspace = true }
tori-py = { workspace = true }
tori-py-cqrs = { workspace = true }
