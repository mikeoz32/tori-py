[project]
name = "tori-py-cqrs-event-sourcing-core"
version = "0.1.0"
description = "Framework-neutral event-sourcing primitives for tori-py-cqrs-core"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tori-py-cqrs-core",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py-cqrs-core = { workspace = true }
