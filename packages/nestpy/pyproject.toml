[project]
name = "nestpy"
version = "0.1.0"
description = "Python-native application framework with a Starlette driver"
requires-python = ">=3.14,<3.15"
dependencies = [
    "msgspec>=0.19.0",
    "starlette>=0.47.0",
]
[project.optional-dependencies]
settings-yaml = ["PyYAML>=6.0"]
cli = ["uvicorn>=0.35.0"]

[project.scripts]
nestpy = "nestpy.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
