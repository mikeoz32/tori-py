[project]
name = "cqrs-event-sourcing"
version = "0.1.0"
description = "Framework-neutral event-sourcing primitives for cqrs-core"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cqrs-core",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
cqrs-core = { workspace = true }
