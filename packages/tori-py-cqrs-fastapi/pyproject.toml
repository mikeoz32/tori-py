[project]
name = "tori-py-cqrs-fastapi"
version = "0.1.0"
description = "FastAPI integration for tori-py-cqrs-core"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tori-py-cqrs-core",
    "fastapi>=0.139.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py-cqrs-core = { workspace = true }
