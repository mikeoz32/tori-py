[project]
name = "nestpy-sqlalchemy"
version = "0.1.0"
description = "Async SQLAlchemy lifecycle and DI integration for Nestpy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nestpy",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
nestpy = { workspace = true }
