[project]
name = "tori-py-persistent-streams-rabbitmq"
version = "0.1.0"
description = "RabbitMQ native Streams adapter for tori-py-persistent-streams-core and ToriPy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tori-py-persistent-streams",
    "tori-py-persistent-streams-core",
    "rstream==1.0.1",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tori-py-persistent-streams = { workspace = true }
tori-py-persistent-streams-core = { workspace = true }
