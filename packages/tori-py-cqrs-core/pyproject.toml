[project]
name = "tori-py-cqrs-core"
version = "0.1.0"
description = "Framework-agnostic CQRS primitives and transports"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mykhailo Kozlovskyi" }]
maintainers = [{ name = "Mykhailo Kozlovskyi" }]
keywords = ["cqrs", "commands", "events", "queries", "typed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mikeoz32/tori-py"
Documentation = "https://github.com/mikeoz32/tori-py/tree/main/packages/tori-py-cqrs-core#readme"
Repository = "https://github.com/mikeoz32/tori-py"
Issues = "https://github.com/mikeoz32/tori-py/issues"
Changelog = "https://github.com/mikeoz32/tori-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"
