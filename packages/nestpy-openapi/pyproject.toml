[project]
name = "nestpy-openapi"
version = "0.1.0"
description = "OpenAPI 3.1 documentation integration for Nestpy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "msgspec>=0.19.0",
    "nestpy",
    "starlette>=0.47.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
nestpy = { workspace = true }
