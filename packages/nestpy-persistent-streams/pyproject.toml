[project]
name = "nestpy-persistent-streams"
version = "0.1.0"
description = "Persistent stream integration for Nestpy"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "nestpy",
    "persistent-streams",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
nestpy = { workspace = true }
persistent-streams = { workspace = true }
