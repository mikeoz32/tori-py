site_name: ToriPy
site_description: Explicit modules, dependency injection, and ASGI applications for Python.
site_url: https://example.invalid/tori-py/
repo_name: tori-py
theme:
  name: material
  language: en
  features:
    - navigation.footer
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
nav:
  - Home: index.md
  - Why ToriPy: why-tori-py.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Application: getting-started/first-application.md
      - Project Structure: getting-started/project-structure.md
      - First Controller: getting-started/first-controller.md
      - First Provider: getting-started/first-provider.md
      - Configuration: getting-started/configuration.md
      - Testing: getting-started/testing.md
      - Next Steps: getting-started/next-steps.md
  - Reference:
      - Task API: reference/task-api.md
  - OpenAPI:
      - Overview: openapi/index.md
      - Configuration: openapi/configuration.md
      - Schemas and Routes: openapi/schemas-and-routes.md
      - Metadata and Responses: openapi/metadata-and-responses.md
      - Security and Swagger UI: openapi/security-and-swagger.md
      - Advanced Usage: openapi/advanced.md
  - Contributing:
      - Public API Inventory: contributing/public-api-inventory.md
      - Documentation Traceability: contributing/traceability.md
