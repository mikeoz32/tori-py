site_name: ToriPy
site_description: Explicit Python modules, dependency injection, ASGI, CQRS, persistence, and messaging.
site_url: https://mikeoz32.github.io/tori-py/
repo_name: tori-py
repo_url: https://github.com/mikeoz32/tori-py
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: table
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
